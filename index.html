<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css"> 
    <title>Linktree CodeVision</title>
</head>
<body>

    <main class="pagina">

        <section class="cartao">

            <!--Logo-->
            <header class="cabecalho">

                <img 
                src="src/assets/CodeVisionLogo.svg" 
                alt="Logo da CodeVision Soluções"
                class="logo"
                >

                <h1 class="titulo">CARTÃO DE <span>VISITA</h1>
                <p class="subtitulo">SOLUÇÕES:</p>


            </header>

            <!--Menu principal-->
            <nav class="menu" aria-label="Menu principal">

                <a href="https://www.instagram.com/" class="botao" data-acao="rede-social">
                    <img src="src/assets/Instagram.png" alt="" class="icone">
                    <span>REDE SOCIAL</span>
                </a>

                <a href="#" class="botao" data-acao="contato">
                    <img src="src/assets/Contato.png" alt="" class="icone">
                    <span>CONTATO</span>
                </a>

                <a href="https://drive.google.com/file/d/1fnS6CUMZFke9k9dVBBsn_5B0JVY-stBj/view?usp=sharing" class="botao" data-acao="servico">
                    <img src="src/assets/Servicos.png" alt="" class="icone">
                    <span>SERVIÇO</span>
                </a>

                <a href="https://drive.google.com/file/d/1xPE-rKoyaOIqqf8XK-FbslmVrtTdZBOd/view?usp=sharing" class="botao" data-acao="projeto">
                    <img src="src/assets/Projeto.png" alt="" class="icone">
                    <span>PROJETO</span>
                </a>

                <a href="#" class="botao" data-acao="site-cliente">
                    <img src="src/assets/Site.png" alt="" class="icone">
                    <span>CLIENTE</span>
                </a>

            </nav>

        </section>
        
    </main>

    <script src="src/js/script.js"></script>
    
</body>
</html>
